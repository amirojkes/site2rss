name: Update RSS feeds

on:
  schedule:
    # Every 30 minutes. GitHub does not guarantee exact timing for
    # scheduled workflows (can be delayed a few minutes under load).
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths:
      - "configs/**"
      - "site2rss.py"
      - "requirements.txt"
      - ".github/workflows/update-feeds.yml"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid two deploys racing each other if a manual run overlaps a scheduled one
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate feeds
        run: python3 site2rss.py --configdir configs --outdir output

      - name: Upload feeds as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
